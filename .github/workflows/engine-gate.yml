# engine-gate.yml — the publish-race gate.
#
# karate/engine.version pins the engine. During a beta that tag may be re-cut on GHCR as the build
# iterates, so the pin can briefly point at an image that is not published yet. Without a gate every
# run then dies at `docker pull` with "manifest unknown" and reads red for a reason that has nothing
# to do with this repo. This probes the pinned tag once, authenticated; the caller gates its own job
# on `present`, so a missing image is a SKIPPED run (grey, workflow green) with a warning naming the
# cause — never a red one.
name: engine-gate

on:
  workflow_call:
    outputs:
      present:
        description: 'true when the pinned engine image exists on GHCR'
        value: ${{ jobs.check.outputs.present }}
      version:
        description: 'the pinned engine version'
        value: ${{ jobs.check.outputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
      version: ${{ steps.probe.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe the pinned engine image
        id: probe
        run: |
          V="$(cat karate/engine.version)"
          IMAGE="ghcr.io/karatelabs/karate-agent:$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "engine image present: $IMAGE"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=engine image not published — lanes skipped::$IMAGE is not on GHCR. karate/engine.version pins a version whose image has not been published yet. Publish the image for this tag, or re-pin at the latest released version. Lanes skip until then — this is a gate, not a failure."
          fi
